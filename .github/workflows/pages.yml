name: Publish page

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *" # GitHub's minimum; runs are often a few minutes late
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect latest draws
        run: |
          mkdir -p _site
          cp index.html _site/
          node scripts/fetch-data.js _site/data.json history.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
